version: 1
name: unicode_wide_borders
intent: |
    examples/unicode mixes wide CJK characters, an emoji, and combining-mark
    sequences inside a bordered box and a list, at 40 columns. Column widths
    are measured with real per-cell East-Asian-width accounting (ADR 0002),
    so the box's right border sits at the same terminal column on every row
    regardless of how many wide glyphs or combining marks that row's text
    contains.
target:
    cmd: ["${vars.tuimark}", "preview", "examples/unicode/app.tui", "--data", "examples/unicode/sample.json", "--cols", "40", "--rows", "24"]
    cwd: "."
terminal:
    # tuimark preview paints the 40x24 grid, then (since preview always also
    # writes the plain-text dump below it) prints ~68 more lines; the PTY
    # viewport is generous so none of that scrolls the painted grid's rows
    # out of the captured screen before the wait/snapshot/cell checks run.
    cols: 80
    rows: 100
steps:
    - wait:
        screen:
            contains: "=== grid 40x24 ==="
        timeoutMs: 3000
    - snapshot: rendered
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: shows_the_wide_header
      description: the header row renders the CJK, café, and fire-emoji text
      verify:
        screen:
            contains: "中文 emoji café"
    - id: panel_right_border_aligned_on_cjk_row
      description: "the panel's right border (│) sits at column 25 on the row that starts with 4 double-width CJK characters (中文测试), so the wide glyphs did not push it out of place"
      verify:
        cell:
            x: 25
            y: 3
            char: "│"
    - id: panel_right_border_aligned_on_emoji_row
      description: "the right border also lands at column 25 on the row with an emoji pair (\U0001F525\U0001F389), each 2 columns wide"
      verify:
        cell:
            x: 25
            y: 5
            char: "│"
    - id: panel_right_border_aligned_on_combining_mark_row
      description: "the right border lands at column 25 on the row built from a base rune plus a combining acute accent (é as e + U+0301), proving the combining mark added no extra column"
      verify:
        cell:
            x: 25
            y: 4
            char: "│"
    - id: panel_right_border_aligned_on_double_combining_row
      description: "the right border still lands at column 25 on the row with two stacked combining marks on one base rune (e + U+0301 + U+0301)"
      verify:
        cell:
            x: 25
            y: 8
            char: "│"
    - id: panel_top_and_bottom_borders_match
      description: the panel's top-left and bottom-left corners sit in the same column as the aligned right border's column (0), confirming the whole box is rectangular
      verify:
        cell:
            x: 0
            y: 1
            char: "┌"
    - id: detail_pane_shows_wrapped_wide_text
      description: the detail pane's wrapped note keeps the CJK phrase intact on its own line instead of splitting a wide character across two
      verify:
        screen:
            contains: "中文测试"
    - id: header_row_wide_cells_hold_their_columns
      description: "the header row reads exactly `中文 emoji café \U0001F525` across its first 18 cells: 中 and 文 take two cells each, the space and `emoji` follow at columns 4-9 with nothing shifted, `café` (precomposed é, one cell) ends at column 14, and the wide fire emoji sits on cells 16-17"
      verify:
        region:
            x: 0
            y: 0
            width: 18
            height: 1
            equals: "中文 emoji café \U0001F525"
    - id: title_row_text_after_wide_cjk_is_not_shifted
      description: "the panel title `配置 \U0001F389` (y=2) reads `│配置 \U0001F389` across its first 8 cells: the space after the two-cell 置 is at column 5 and the wide \U0001F389 occupies cells 6-7, so text after a wide character is not captured one column off"
      verify:
        region:
            x: 0
            y: 2
            width: 8
            height: 1
            equals: "│配置 \U0001F389"
    - id: list_cjk_row_has_two_cells_per_character
      description: "the list row `1 中文测试` (y=3) reads `│1中文测试` across its first 10 cells: each of the four CJK characters takes two cells (character first, empty continuation second), filling columns 2-9 with no padding between them"
      verify:
        region:
            x: 0
            y: 3
            width: 10
            height: 1
            equals: "│1中文测试"
    - id: list_combining_row_joins_marks_into_one_cell
      description: "the row `2 café latte` (y=4), where é is e plus U+0301, reads `│2café latte` across 12 cells: the combining mark joins its base into one cell (column 5), so `latte` starts at column 7 and not one column later"
      verify:
        region:
            x: 0
            y: 4
            width: 12
            height: 1
            equals: "│2café latte"
    - id: list_emoji_row_text_after_wide_emoji
      description: "the row `3emoji \U0001F525\U0001F389` (y=5) reads `│3emoji \U0001F525\U0001F389` across its first 12 cells: \U0001F525 takes cells 8-9 and \U0001F389 cells 10-11 with no blank cell between them (a one-cell emoji would leave one)"
      verify:
        region:
            x: 0
            y: 5
            width: 12
            height: 1
            equals: "│3emoji \U0001F525\U0001F389"
    - id: list_diaeresis_cell_holds_base_and_mark
      description: "on the row `4 naïve` (y=6), ï is i plus U+0308 joined in one cell (column 4): the cell's character is the whole cluster, not a bare `i` with the accent lost, and the `v` after it sits at column 5"
      verify:
        cell:
            x: 4
            y: 6
            char: "ï"
    - id: list_mixed_row_text_after_wide_glyphs
      description: "the row `5 中文\U0001F4E6mix` (y=7) reads `│5中文\U0001F4E6mix` across its first 11 cells: three wide glyphs on cells 2-7, so `mix` starts at column 8 right after the wide \U0001F4E6"
      verify:
        region:
            x: 0
            y: 7
            width: 11
            height: 1
            equals: "│5中文\U0001F4E6mix"
    - id: list_double_combining_cell_holds_all_marks
      description: "on the row `6 é́ double` (y=8), e with two stacked U+0301 accents is a single cell (column 2) holding all three code points, so ` double` starts at column 3"
      verify:
        cell:
            x: 2
            y: 8
            char: "é́"
    - id: detail_pane_cjk_line_two_cells_per_character
      description: "in the detail pane (it starts at column 26, border first) the wrapped line `中文测试` (y=7) reads `│中文测试` across the first 9 cells of the pane, again two cells per CJK character"
      verify:
        region:
            x: 26
            y: 7
            width: 9
            height: 1
            equals: "│中文测试"
contractHash: sha256:2af3d694de50fe848d8a10042c24bf3e9fc7f5cbf4e8c33137aad28e54518c5d
