version: 1
name: run_reload_state
intent: |
    Editing the .tui under `tuimark run` reloads it into a new app (SPEC
    v0.4a §15.9 "Reload", test 121): the session goes on with the store
    moved over (a mock write made before the edit still shows) and, by id
    and tag, the active screen, the active tab of a tabs without bind, a
    list cursor, an input's text, a scroll offset, and the focus, while the
    strip gains a "reload" line. The fixture script makes the edit when the
    session records the host action "edit" (ctrl+r), so the spec never
    sleeps.
target:
    cmd: ["sh", "specs/fixtures/run/session.sh", "${vars.tuimark}", "reload", "--strip"]
    cwd: "."
terminal:
    cols: 100
    rows: 30
steps:
    - wait:
        screen:
            contains: "HOME"
        timeoutMs: 5000
    - press: w
    - press: "2"
    - press: down
    - press: down
    - wait:
        screen:
            contains: 'pick l {"r":"c"} null'
        timeoutMs: 3000
    - press: J
    - press: tab
    - type: "hi"
    - press: ctrl+r
    - wait:
        screen:
            contains: "VERSION-TWO"
        timeoutMs: 5000
    - wait:
        screen:
            contains: "reload"
        timeoutMs: 3000
    - snapshot: after_reload
    - type: "!"
    - wait:
        screen:
            contains: "hi!"
        timeoutMs: 3000
    - press: shift+tab
    - press: down
    - wait:
        screen:
            contains: 'pick l {"r":"d"} null'
        timeoutMs: 3000
    - snapshot: after_moves
    - press: ctrl+c
    - wait:
        screen:
            contains: "session-done"
        timeoutMs: 5000
outcomes:
    - id: screen_and_tab_kept
      description: after the reload the work screen is still active, showing the second tab's content and not the first's
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/after_reload.txt"
                if grep -q "VERSION-TWO" "$f" && grep -q "row-a" "$f" && ! grep -q "FIRST TAB" "$f" && ! grep -q "HOME" "$f"; then
                  echo '{"ok": true, "evidence": "screen work and tab t2 kept"}'
                else
                  echo '{"ok": false, "evidence": "the active screen or tab was reset"}'
                fi
    - id: store_moved
      description: the mock write the edit action made before the reload still shows after it
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/after_reload.txt"
                if grep -q "VERSION-TWO note=from-mock" "$f"; then
                  echo '{"ok": true, "evidence": "the store moved to the new app"}'
                else
                  echo '{"ok": false, "evidence": "the store was not kept"}'
                fi
    - id: input_text_and_scroll_offset_kept
      description: the input still holds hi, and the scroll still starts at s1
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/after_reload.txt"
                if grep -q "hi" "$f" && grep -q "s1" "$f" && ! grep -q "s0" "$f"; then
                  echo '{"ok": true, "evidence": "input text and scroll offset kept"}'
                else
                  echo '{"ok": false, "evidence": "the input text or the scroll offset was reset"}'
                fi
    - id: focus_kept
      description: typing after the reload goes on into the focused input
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/after_moves.txt"
                if grep -q "hi!" "$f"; then
                  echo '{"ok": true, "evidence": "the input kept the focus"}'
                else
                  echo '{"ok": false, "evidence": "the focus moved"}'
                fi
    - id: list_cursor_kept
      description: one down after the reload moves the list cursor from row c to row d
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/after_moves.txt"
                if grep -q 'pick l {"r":"d"} null' "$f"; then
                  echo '{"ok": true, "evidence": "the cursor stayed on c across the reload"}'
                else
                  echo '{"ok": false, "evidence": "the list cursor was reset"}'
                fi
    - id: exits_zero
      description: ctrl+c after the reload exits 0
      verify:
        screen:
            contains: "run-exit=0"
contractHash: sha256:ee59b2b6f20251ffe538da338417e7908adae93a829fecd53de7a153eef8e13d
