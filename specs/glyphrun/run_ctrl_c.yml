version: 1
name: run_ctrl_c
intent: |
    `tuimark run` registers no quit handler, so ctrl+c, unbound in the
    document, is the built-in quit: the session ends and run exits 0 (SPEC
    v0.4a §15.9 "Exit codes", test 121 "Exit").
target:
    cmd: ["sh", "specs/fixtures/run/session.sh", "${vars.tuimark}", "plain"]
    cwd: "."
terminal:
    cols: 80
    rows: 24
steps:
    - wait:
        screen:
            contains: "PLAIN"
        timeoutMs: 5000
    - press: ctrl+c
    - wait:
        screen:
            contains: "session-done"
        timeoutMs: 5000
    - wait:
        process:
            exitCode: 0
        timeoutMs: 3000
outcomes:
    - id: ctrl_c_exits_zero
      description: one ctrl+c ends the session with exit 0
      verify:
        screen:
            contains: "run-exit=0"
contractHash: sha256:e226a0bc1c7ed107dc6a71d12858084cfa9aef2bbf8ed25a1abb8dd8e9845b5c
