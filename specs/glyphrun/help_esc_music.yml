version: 1
name: help_esc_music
intent: |
    examples/music writes no version, so it is the current language, where
    esc closes the top modal (SPEC v0.4b §31.7, test 172). Its help modal
    holds a two-column table of the keys and a close button that takes
    focus. `?` opens it; esc fires the modal's on:escape (help_close), the
    host writes the help's flag false, and the app comes back, still
    running, with `? help` in its hint bar. The marker is the esc row of the
    help's table.
target:
    cmd: ["${vars.music}"]
    cwd: "."
terminal:
    cols: 120
    rows: 24
steps:
    - wait:
        screen:
            contains: "◆ music"
        timeoutMs: 5000
    - press: "?"
    - wait:
        screen:
            contains: "close/clear filter"
        timeoutMs: 3000
    - snapshot: help_open
    - press: esc
    - wait:
        screen:
            notContains: "close/clear filter"
        timeoutMs: 3000
    - wait:
        screen:
            contains: "? help"
        timeoutMs: 3000
    - snapshot: help_closed
outcomes:
    - id: question_mark_opens_the_help
      description: "? opens the help modal"
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/help_open.txt"
                if grep -qF 'close/clear filter' "$f"; then
                  echo '{"ok": true, "evidence": "the help_open snapshot shows the help"}'
                else
                  echo '{"ok": false, "evidence": "? did not open the help"}'
                fi
    - id: esc_closes_the_help
      description: esc closes the help through on:escape; the app and its hint bar are back
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/help_closed.txt"
                if ! grep -qF 'close/clear filter' "$f" && grep -qF '◆ music' "$f" && grep -qF '? help' "$f"; then
                  echo '{"ok": true, "evidence": "the help_closed snapshot shows the app and its hint bar without the help"}'
                else
                  echo '{"ok": false, "evidence": "esc did not close the help, or the app did not come back"}'
                fi
contractHash: sha256:aa44fbf9df19e1539056271318917a8d3d501a41de5af32aa61ae19e268ab663
