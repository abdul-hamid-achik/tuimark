version: 1
name: help_esc_containers
intent: |
    examples/containers writes no version, so it is the current language,
    where esc closes the top modal (SPEC v0.4b §31.7, test 172). Its help
    modal holds the kit's help overlay, every labeled key in a scroll. `?`
    opens it; esc fires the modal's on:escape (help_close), the host writes
    the help's flag false, and the app comes back, still running, with
    `? help` in its hint bar. `close help` is the help's own `? close help`
    line, shown only while the overlay is open; its keymap row has no label
    (F15), so no hint bar lists it.
target:
    cmd: ["${vars.containers}"]
    cwd: "."
terminal:
    cols: 120
    rows: 24
steps:
    - wait:
        screen:
            contains: "◆ containers"
        timeoutMs: 5000
    - press: "?"
    - wait:
        screen:
            contains: "close help"
        timeoutMs: 3000
    - snapshot: help_open
    - press: esc
    - wait:
        screen:
            notContains: "close help"
        timeoutMs: 3000
    - wait:
        screen:
            contains: "? help"
        timeoutMs: 3000
    - snapshot: help_closed
outcomes:
    - id: question_mark_opens_the_help
      description: "? opens the help modal"
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/help_open.txt"
                if grep -qF 'close help' "$f"; then
                  echo '{"ok": true, "evidence": "the help_open snapshot shows the help"}'
                else
                  echo '{"ok": false, "evidence": "? did not open the help"}'
                fi
    - id: esc_closes_the_help
      description: esc closes the help through on:escape; the app and its hint bar are back
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/help_closed.txt"
                if ! grep -qF 'close help' "$f" && grep -qF '◆ containers' "$f" && grep -qF '? help' "$f"; then
                  echo '{"ok": true, "evidence": "the help_closed snapshot shows the app and its hint bar without the help"}'
                else
                  echo '{"ok": false, "evidence": "esc did not close the help, or the app did not come back"}'
                fi
contractHash: sha256:f218e686b26c9ce14cafe2a8b06ae8b53b5886ad15f5a81ac8d3bee7c585e2ce
