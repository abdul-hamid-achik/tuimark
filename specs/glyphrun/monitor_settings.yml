version: 1
name: monitor_settings
intent: |
    The Settings tab of examples/monitor (SPEC v0.2b §17.4) edits its
    settings in place: a click on the "8 settings" label (mouse on)
    activates the tab with focus on the settings list; enter and space
    move the cursor row's setting to its next value and - to its previous
    one; s saves and the status line appears. Switching the mouse setting
    off sets the document's mouse attribute (mouse="mouse_enabled") to
    false, so the runtime turns the terminal's mouse modes off and a later
    click on a tab label does nothing, without a restart.
target:
    cmd: ["${vars.monitor}"]
    cwd: "."
terminal:
    cols: 120
    rows: 24
steps:
    - wait:
        screen:
            contains: "▸7 processes"
        timeoutMs: 5000
    - mouse:
        x: 84
        y: 1
        button: left
        action: click
    - wait:
        screen:
            contains: "▸8 settings"
        timeoutMs: 2000
    - wait:
        screen:
            contains: "enter change"
        timeoutMs: 2000
    - snapshot: settings
    - press: enter
    - wait:
        screen:
            contains: "theme                   dark"
        timeoutMs: 2000
    - press: space
    - wait:
        screen:
            contains: "theme                   light"
        timeoutMs: 2000
    - press: "-"
    - wait:
        screen:
            contains: "theme                   dark"
        timeoutMs: 2000
    - snapshot: changed
    - press: s
    - wait:
        screen:
            contains: "saved: 1 changed"
        timeoutMs: 2000
    - snapshot: saved
    - press: j
    - press: j
    - press: enter
    - wait:
        screen:
            contains: "mouse                   off"
        timeoutMs: 2000
    - snapshot: mouse_off
    - mouse:
        x: 5
        y: 1
        button: left
        action: click
    - press: j
    - press: enter
    - wait:
        screen:
            contains: "memory units            decimal"
        timeoutMs: 2000
    - snapshot: after_click
outcomes:
    - id: click_opens_settings
      description: with the mouse on, a click on the "8 settings" label activates the settings tab and focuses its list (its hints show in the bar)
      verify:
        script:
            runtime: shell
            run: |
                f="$GLYPHRUN_RUN_DIR/snapshots/settings.txt"
                if grep -q "▸8 settings" "$f" && grep -q "refresh interval" "$f" && grep -q "enter change" "$f"; then
                  echo '{"ok": true, "evidence": "the settings snapshot shows the tab active and the list focused"}'
                else
                  echo '{"ok": false, "evidence": "the click on the label did not open the settings"}'
                fi
    - id: enter_space_minus_change_the_value
      description: enter and space move the theme setting to its next values (auto, dark, light) and - back to dark
      verify:
        script:
            runtime: shell
            run: |
                if grep -q "theme                   dark" "$GLYPHRUN_RUN_DIR/snapshots/changed.txt"; then
                  echo '{"ok": true, "evidence": "auto -> dark -> light -> dark, the wait steps saw each value"}'
                else
                  echo '{"ok": false, "evidence": "the setting did not change"}'
                fi
    - id: s_saves_with_status
      description: s saves the settings and the status line reports it
      verify:
        script:
            runtime: shell
            run: |
                if grep -q "saved: 1 changed" "$GLYPHRUN_RUN_DIR/snapshots/saved.txt"; then
                  echo '{"ok": true, "evidence": "the saved snapshot shows the status line"}'
                else
                  echo '{"ok": false, "evidence": "no save status"}'
                fi
    - id: mouse_off_ignores_clicks
      description: after the mouse setting is switched off, a click on the "1 overview" label does nothing; the settings tab stays active and the keys typed after it (j, enter) still act on the settings list
      verify:
        script:
            runtime: shell
            run: |
                d="$GLYPHRUN_RUN_DIR/snapshots"
                if grep -q "mouse                   off" "$d/mouse_off.txt" && grep -q "▸8 settings" "$d/after_click.txt" && ! grep -q "▸1 overview" "$d/after_click.txt"; then
                  echo '{"ok": true, "evidence": "the click after mouse off left 8 settings active"}'
                else
                  echo '{"ok": false, "evidence": "a click acted with the mouse setting off"}'
                fi
contractHash: sha256:49967bcbb3571d1d30fe958505cb9c7ffcb4fa0962377cefcb756f99d25dfc54
