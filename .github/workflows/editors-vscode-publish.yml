name: Publish VS Code extension

# Publishes editors/vscode to the Visual Studio Marketplace and to Open VSX
# from an `editors-vscode-vX.Y.Z` tag. It needs the owner's accounts and two
# repository secrets: VSCE_PAT (a Marketplace personal access token for the
# `abdul-hamid-achik` publisher, scope Marketplace > Manage) and OVSX_PAT (an
# Open VSX access token for the same namespace). A missing secret skips that
# store, still tries the other, and then fails the run, so a store that was not
# published shows as pending instead of passing as done.

on:
  push:
    tags:
      - "editors-vscode-v*"

permissions:
  contents: read

jobs:
  publish:
    name: build, test, publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: The tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want="${TAG#editors-vscode-v}"
          have="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "$want" != "$have" ]; then
            echo "::error::tag $TAG does not match package.json version $have"
            exit 1
          fi

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Package
        run: bunx @vscode/vsce package --out tuimark.vsix

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuimark-vscode-vsix
          path: editors/vscode/tuimark.vsix
          if-no-files-found: error

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not set; the Visual Studio Marketplace is pending"
            echo "Visual Studio Marketplace" >> "$RUNNER_TEMP/pending-stores"
            exit 0
          fi
          bunx @vscode/vsce publish --packagePath tuimark.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set; Open VSX is pending"
            echo "Open VSX" >> "$RUNNER_TEMP/pending-stores"
            exit 0
          fi
          bunx ovsx publish tuimark.vsix

      # A store without its secret is pending, not published: the run goes red
      # so it is not mistaken for a release.
      - name: Fail if a store was left pending
        run: |
          if [ -s "$RUNNER_TEMP/pending-stores" ]; then
            echo "::error::not published (secret missing): $(paste -sd, "$RUNNER_TEMP/pending-stores")"
            exit 1
          fi
