name: Release

# A `v*` tag runs the behavioral specs, publishes the GitHub release with
# GoReleaser (archives for Homebrew, raw binaries for npm, checksums.txt), and
# then publishes the npm package @thelacanians/tuimark (sdk/ts), whose version
# is the tag's and whose `tuimark` command downloads those raw binaries.
#
# npm trusted publishing: the trusted publisher of @thelacanians/tuimark on
# npmjs.com names THIS file (release.yml), the repository
# abdul-hamid-achik/tuimark, and the environment `npm`. npm checks the
# workflow filename, so do not rename it or move the npm-publish job to
# another file. (A separate workflow on `release: published` would never fire:
# releases created with GITHUB_TOKEN do not trigger other workflows.)
#
# The `npm` environment (created by the owner in Settings, Environments) has a
# deployment rule that allows only tags `v*`, so nothing but a release tag can
# publish. Run by hand ("Run workflow", "Use workflow from" = a release tag),
# the workflow only publishes the npm package of that tag, for example after
# the npm-publish job of the tag's own run failed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    name: release behavioral specs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go for Glyphrun
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Glyphrun requires Go 1.26; the release build below uses the same
          # exact version.
          go-version: "1.26.6"
          cache: true

      # The examples/host-ts specs (specs/glyphrun/host_ts*.yml) run its
      # TypeScript parent with Bun, and a release tag must not skip them
      # (only a local `task glyph` without bun does), so Bun is installed,
      # pinned.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install go-task and Glyphrun
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.22.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        run: task build

      - name: Check golden dumps
        run: ./bin/tuimark test

      # Every spec runs offline: the agent specs use the scripted provider
      # or the in-process loopback fixture, never a real model server.
      - name: Run behavioral specs
        run: .github/scripts/glyph-specs.sh

  release:
    needs: specs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # GoReleaser needs full history and tags for the changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Validate release configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: check

      - name: Run static analysis
        run: go vet ./...

      - name: Run race-enabled tests
        run: go test -race -count=1 ./...

      # The release notes are the tag's CHANGELOG.md section, after the
      # install commands; a tag without a section fails the release.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            printf '```sh\nbrew install --cask abdul-hamid-achik/tap/tuimark\ngo install github.com/abdul-hamid-achik/tuimark/cmd/tuimark@%s\n```\n\nDocs: https://tuimark.vercel.app\n' "$TAG"
            awk -v h="## [$version]" 'index($0, h) == 1 { f = 1; next } /^## \[/ { if (f) exit } f' CHANGELOG.md
          } > "$notes"
          if [ "$(wc -l < "$notes")" -le 6 ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "v2.17.0"
          args: release --clean --release-notes=${{ env.RELEASE_NOTES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with write access to abdul-hamid-achik/homebrew-tap. When it
          # is not set the release still publishes; only the cask update is
          # skipped (see skip_upload in .goreleaser.yaml).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The npm package is built here, in a job that cannot mint an OIDC token:
  # install, test, type-check, build, and pack all run project code. Only the
  # small npm-publish job below holds `id-token: write`, and it publishes the
  # tarball this job made without checking out or installing anything.
  npm-pack:
    name: npm package (build)
    needs: release
    # After a pushed tag's release succeeded, or by hand (the release job is
    # skipped then). Never after a failed release or specs job.
    if: ${{ !cancelled() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check the tag
        id: version
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != tag ] || ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::the npm package is published from a release tag like v1.2.3, not from $GITHUB_REF"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # The package downloads these files, by these names, from the release.
      # Check that GoReleaser published them before the package that needs
      # them is published (this also catches a naming drift between
      # .goreleaser.yaml and sdk/ts/src/binary.ts).
      - name: Check the release has the binaries the package downloads
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 --retry-all-errors \
            --output "$RUNNER_TEMP/checksums.txt" "$url/checksums.txt"
          missing=0
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64.exe windows_arm64.exe; do
            name="tuimark_${VERSION}_${target}"
            if ! grep -Eq "^[0-9a-f]{64}  ${name//./\\.}\$" "$RUNNER_TEMP/checksums.txt"; then
              echo "::error::checksums.txt of $TAG does not list $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install, test, and type-check
        working-directory: sdk/ts
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit

      # The package version is the release version: the launcher downloads
      # the binaries of the release with the same number.
      - name: Set the version from the tag
        working-directory: sdk/ts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # The hashes of the six binaries go into the package, so the launcher
      # checks what it downloads against npm's copy and not only against a file
      # that sits next to the binary on GitHub.
      - name: Embed the release checksums
        working-directory: sdk/ts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/embed-checksums.mjs "$RUNNER_TEMP/checksums.txt" "$VERSION"

      - name: Build and pack
        working-directory: sdk/ts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bun run build
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          tarball="$RUNNER_TEMP/pack/thelacanians-tuimark-${VERSION}.tgz"
          test -f "$tarball"
          # Read the tarball into files first: `tar … | grep -q` fails under
          # pipefail when grep exits on its first match and tar gets SIGPIPE.
          tar -tzf "$tarball" | sort > "$RUNNER_TEMP/pack/files.txt"
          /bin/cat "$RUNNER_TEMP/pack/files.txt"
          tar -xOzf "$tarball" package/dist/embedded.js > "$RUNNER_TEMP/pack/embedded.js"
          # the launcher, the compiled client, and the TypeScript source Bun runs
          for f in package/bin/tuimark.js package/dist/index.js package/dist/binary.js package/dist/embedded.js package/src/index.ts package/package.json; do
            grep -qx "$f" "$RUNNER_TEMP/pack/files.txt" || { echo "::error::$f is not in the package"; exit 1; }
          done
          # the built-in table is the one of this version
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64.exe windows_arm64.exe; do
            grep -q "tuimark_${VERSION}_${target}" "$RUNNER_TEMP/pack/embedded.js" \
              || { echo "::error::dist/embedded.js has no hash for $target"; exit 1; }
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuimark-npm-package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Trusted publishing (GitHub Actions OIDC): no npm token is stored. It needs
  # Node >= 22.14 and npm >= 11.5.1, both pinned below. The package must
  # already exist on npm with this workflow registered as its trusted
  # publisher, so the very first version is published by hand (see the
  # owner's PUBLISHING.md); this job then fails loudly until that is done.
  npm-publish:
    name: npm package (publish)
    needs: npm-pack
    # Explicit, because when the run is a manual one the `release` job two
    # levels up is skipped, and a skipped ancestor skips this job too
    # (actions/runner#2205).
    if: ${{ !cancelled() && needs.npm-pack.result == 'success' }}
    # The deployment rule of this environment allows only tags `v*`; the trusted
    # publisher on npmjs.com names it too.
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.npm-pack.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm
        run: |
          set -euo pipefail
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tuimark-npm-package
          path: pack

      - name: Publish to npm
        run: |
          set -euo pipefail
          # A re-run after a successful publish has nothing to do.
          if npm view "@thelacanians/tuimark@${VERSION}" version > /dev/null 2>&1; then
            echo "::notice::@thelacanians/tuimark@${VERSION} is already on npm"
            exit 0
          fi
          # npm 11 refuses a prerelease version without a dist-tag.
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish ./pack/thelacanians-tuimark-"${VERSION}".tgz --ignore-scripts --access public --provenance --tag "$tag"
