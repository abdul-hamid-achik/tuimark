name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # go.mod's minimum, so the declared floor stays continuously
          # tested. Linux only: binaries from the Go 1.22 linker that link
          # net abort at start-up on current macOS (dyld: missing LC_UUID),
          # which is a toolchain/OS mismatch rather than a tuimark bug.
          - os: ubuntu-latest
            go: "1.22"
          # The current release, on both platforms.
          - os: ubuntu-latest
            go: "1.26"
          - os: macos-latest
            go: "1.26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt: the files above are not formatted (run: gofmt -w .)"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...

      # kit/go is its own module (the kit's copyable host helpers, ADR 0030),
      # so ./... above does not reach it. It declares go.mod's Go floor too,
      # so the 1.22 leg keeps it compatible with that.
      - name: kit/go vet and test -race
        working-directory: kit/go
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: build
        run: |
          go build -o bin/tuimark ./cmd/tuimark
          go build -o bin/inbox ./examples/inbox
          go build -o bin/dashboard ./examples/dashboard
          go build -o bin/monitor ./examples/monitor
          go build -o bin/agent ./examples/agent

      - name: golden dumps
        run: ./bin/tuimark test

  # The performance benchmarks (SPEC test 125): each case must stay under
  # 16 ms/op on this Linux runner too. They are recorded, not asserted (a
  # shared runner's timings are noisy), so the numbers go to the job
  # summary and the job never fails on them.
  bench:
    name: benchmarks (recorded, not gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: go test -bench
        run: |
          go test ./internal/play -run '^$' -bench . -benchmem -count 1 | tee bench.txt
          {
            echo '### Benchmarks (SPEC test 125, budget 16 ms/op)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # GoReleaser ships Windows zips (.goreleaser.yaml), but no job runs on
  # Windows. Cross-compiling and vetting for it on Linux is cheap and
  # catches the usual breakage (a POSIX-only syscall outside a build-tagged
  # file) without a Windows runner; the tests themselves are not run there.
  windows:
    name: windows build and vet (GOARCH=${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  # The runtime as WebAssembly, for the website's playground (ADR 0033): the
  # js/wasm build of cmd/tuimark-wasm and its size budget, go test of the core
  # packages under js (Node runs the test binaries), and a smoke test that
  # loads the real .wasm and compares every example's dump with the native
  # CLI's. Pinned to Go 1.26: lib/wasm (wasm_exec.js, go_js_wasm_exec) only
  # exists from Go 1.24, and the matrix above also runs go.mod's 1.22.
  wasm:
    name: js/wasm build, tests, size, and native parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build tuimark.wasm
        run: |
          GOOS=js GOARCH=wasm go vet ./cmd/tuimark-wasm ./internal/playground
          GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o bin/tuimark.wasm ./cmd/tuimark-wasm
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" bin/wasm_exec.js

      - name: Size budget (brotli 1.5 MB, gzip 2.0 MB)
        run: node cmd/tuimark-wasm/testdata/size.mjs bin/tuimark.wasm

      # The wrapper runs Go's wasm_exec_node.js with a minimal environment: a
      # runner's environment alone exceeds wasm_exec.js's argv+env limit.
      - name: go test under js/wasm (core packages)
        env:
          GOOS: js
          GOARCH: wasm
        run: go test -count=1 -exec "$PWD/.github/scripts/go-js-wasm-exec.sh" . ./internal/...

      - name: Smoke test and native-vs-wasm dump parity
        run: |
          go build -o bin/tuimark ./cmd/tuimark
          node cmd/tuimark-wasm/testdata/smoke.mjs bin/tuimark.wasm --cli bin/tuimark

  specs:
    name: glyphrun specs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # Glyphrun requires Go 1.26. The test matrix above also runs
          # go.mod's Go 1.22 so tuimark's declared minimum stays tested.
          go-version: "1.26"
          cache: true

      # The examples/host-ts specs (specs/glyphrun/host_ts*.yml) run its
      # TypeScript parent with Bun. `task glyph` skips them where bun is
      # missing; here they must run, so Bun is installed, pinned.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install go-task and glyph (glyphrun)
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.51.1
          go install github.com/abdul-hamid-achik/glyphrun/cmd/glyph@v0.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build binaries
        run: task build

      # Every spec runs offline: the agent specs use the scripted provider
      # or the in-process loopback fixture, never a real model server.
      - name: Run specs
        run: .github/scripts/glyph-specs.sh

      - name: Upload glyphrun run artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glyphrun-runs-${{ matrix.os }}
          path: .glyphrun/runs/
          retention-days: 7
          if-no-files-found: ignore

  # The VS Code extension (editors/vscode) is a separate package with its own
  # lockfile (SPEC 0.4a, test 124). It needs no Go: it builds, runs its grammar
  # and manifest tests, and packages a .vsix.
  vscode:
    name: vscode extension (build, grammar tests, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Grammar, manifest, and client tests
        run: bun run test

      - name: Package
        run: bunx @vscode/vsce package

      - name: Upload the .vsix
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuimark-vscode-vsix
          path: editors/vscode/*.vsix
          retention-days: 7
          if-no-files-found: error

  docs:
    name: docs site (generated pages fresh, Next.js build, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26"
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Generated reference pages and screenshots are up to date
        run: |
          go build -o bin/tuimark ./cmd/tuimark
          node docs/scripts/generate.mjs --check

      - name: Build the site (static pages, type-checked)
        working-directory: docs
        run: npm ci && npm run build

      - name: Every link, anchor, and asset in the built pages resolves
        working-directory: docs
        run: npm run check-links

  # @thelacanians/tuimark (sdk/ts, SPEC §19.2): Bun tests against a fake child, a
  # type-check, and the `tuimark` launcher under Node. It needs neither Go nor the
  # tuimark binary (downloads are tested against a local server); the real child is
  # driven by examples/host-ts in the specs job above. kit/ts (the kit's copyable
  # TypeScript helpers) is typed against it and tested the same way, against an
  # in-memory store.
  sdk-ts:
    name: "sdk/ts (@thelacanians/tuimark) and kit/ts (test and type-check)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Type-check
        run: bunx tsc --noEmit

      - name: Type-check the tuimark new --ts template
        run: bunx tsc -p tsconfig.template.json

      # dist/ makes the launcher tests run bin/tuimark.js under Node as well
      # as Bun (the tests pick `node` up from PATH).
      - name: Build
        run: bun run build

      - name: Launcher under Bun and Node
        run: bun test test/launcher.test.ts

      - name: Package contents
        run: npm pack --dry-run --ignore-scripts

      # kit/ts depends on sdk/ts through a file: dependency, which bun copies,
      # so it is always installed fresh.
      - name: kit/ts install (frozen lockfile)
        working-directory: kit/ts
        run: rm -rf node_modules && bun install --frozen-lockfile

      - name: kit/ts test
        working-directory: kit/ts
        run: bun test

      - name: kit/ts type-check
        working-directory: kit/ts
        run: bunx tsc --noEmit
