name: sdk-ts publish

# Publishes @tuimark/host (sdk/ts, SPEC §19.2) to npm from a `sdk-ts-v*` tag,
# with npm trusted publishing (GitHub Actions OIDC) and provenance: register
# this workflow as the trusted publisher of @tuimark/host on npmjs, and no
# token is needed. Trusted publishing needs Node >= 22.14 and npm >= 11.5.1;
# both are pinned here because the runner's defaults are not part of the
# release contract.
#
# Two jobs on purpose, as in chalupa's npm publish workflow: everything that
# installs or runs project code (install, tests, type-check, build, pack) runs
# in `validate`, which cannot mint an OIDC token. Only the small `publish` job
# holds `id-token: write`, and it publishes the tarball `validate` built; it
# checks out and installs nothing.
#
# A tag `sdk-ts-vX.Y.Z` must match sdk/ts/package.json's version X.Y.Z. If the
# `@tuimark` scope cannot be had, the package is renamed `tuimark-host` in
# package.json before the first tag (ADR 0024).
on:
  push:
    tags:
      - "sdk-ts-v*"

permissions:
  contents: read

# One release at a time, and never cancel a publish half way.
concurrency:
  group: sdk-ts-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Require the tag to match package.json
        run: |
          set -euo pipefail
          package_version="$(bun -e 'process.stdout.write(require("./package.json").version)')"
          if [ "$GITHUB_REF_NAME" != "sdk-ts-v$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          ls -l "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tuimark-host-package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Use an OIDC-capable npm
        run: |
          set -euo pipefail
          npm install --global npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tuimark-host-package
          path: pack

      # Trusted publishing (OIDC) needs the package to exist on npm, so the
      # very first publish of 1.0.0 cannot use it: an NPM_TOKEN secret, when
      # set, is used instead (as in chalupa's npm-publish workflow). Once the
      # package exists and a trusted publisher with `npm publish` allowed is
      # configured for this workflow, remove the secret.
      - name: Publish to npm
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc"
            export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc"
          fi
          npm publish ./pack/*.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
