# https://taskfile.dev
#
# Every command below also works copy-pasted into a shell by hand (in the
# repo root) in case `task` itself is not installed.
version: "3"

vars:
  AGENT_DIR: examples/agent

tasks:
  build:
    desc: Build tuimark, the example apps (inbox, dashboard, monitor, logs, tasks, gitui, http, kit-gallery, containers, snake, chess, tetris, minesweeper, 2048, sudoku, pipeline, music, pomodoro), and (once it has Go files) agent into bin/.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - go build -o bin/inbox ./examples/inbox
      - go build -o bin/dashboard ./examples/dashboard
      - go build -o bin/monitor ./examples/monitor
      - go build -o bin/logs ./examples/logs
      - go build -o bin/tasks ./examples/tasks
      - go build -o bin/gitui ./examples/gitui
      - go build -o bin/http ./examples/http
      - go build -o bin/kit-gallery ./examples/kit-gallery
      - go build -o bin/containers ./examples/containers
      - go build -o bin/snake ./examples/snake
      - go build -o bin/chess ./examples/chess
      - go build -o bin/tetris ./examples/tetris
      - go build -o bin/minesweeper ./examples/minesweeper
      - go build -o bin/2048 ./examples/2048
      - go build -o bin/sudoku ./examples/sudoku
      - go build -o bin/pipeline ./examples/pipeline
      - go build -o bin/music ./examples/music
      - go build -o bin/pomodoro ./examples/pomodoro
      - |
        if ls {{.AGENT_DIR}}/*.go >/dev/null 2>&1; then
          go build -o bin/agent ./{{.AGENT_DIR}}
        else
          echo "skip bin/agent: {{.AGENT_DIR}} has no Go files yet"
        fi

  fmt:
    desc: Fail if any tracked .go file is not gofmt-clean.
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "$out"
          echo "gofmt: the files above are not formatted (run: gofmt -w .)" >&2
          exit 1
        fi

  vet:
    desc: go vet the whole module.
    cmds:
      - go vet ./...

  test:
    desc: go test the whole module.
    cmds:
      - go test ./...

  golden:
    desc: Check dump goldens with the tuimark CLI's own test subcommand.
    deps: [build]
    cmds:
      - ./bin/tuimark test

  kit-go:
    desc: Vet and test kit/go (the kit's copyable Go helpers, a nested module), with the race detector.
    dir: kit/go
    cmds:
      - go vet ./...
      - go test -count=1 ./...
      - go test -race -count=1 ./...

  kit-ts:
    desc: Install fresh, test, and type-check kit/ts (the kit's copyable TypeScript helpers; a file
      dependency on sdk/ts, which bun copies). Skipped without `bun`.
    dir: kit/ts
    cmds:
      - |
        if command -v bun >/dev/null 2>&1; then
          rm -rf node_modules
          bun install --frozen-lockfile
          bun test
          bunx tsc --noEmit
        else
          echo "skipping kit/ts: bun not found"
        fi

  wasm:
    desc: Build the playground's WebAssembly runtime (cmd/tuimark-wasm, ADR 0033) into bin/tuimark.wasm,
      and copy the wasm_exec.js of the same Go toolchain next to it.
    cmds:
      - GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o bin/tuimark.wasm ./cmd/tuimark-wasm
      - |
        # Go 1.24 moved wasm_exec.js from misc/wasm to lib/wasm.
        root="$(go env GOROOT)"
        for d in lib/wasm misc/wasm; do
          if [ -f "$root/$d/wasm_exec.js" ]; then cp "$root/$d/wasm_exec.js" bin/wasm_exec.js; exit 0; fi
        done
        echo "wasm_exec.js not found under $root" >&2
        exit 1

  wasm-check:
    desc: Check bin/tuimark.wasm against its size budget (brotli 1.5 MB, gzip 2.0 MB) and run the Node
      smoke test, which also compares every example's wasm dump with the native CLI's. Skipped without `node`.
    deps: [wasm, build]
    cmds:
      - |
        if command -v node >/dev/null 2>&1; then
          node cmd/tuimark-wasm/testdata/size.mjs bin/tuimark.wasm &&
          node cmd/tuimark-wasm/testdata/smoke.mjs bin/tuimark.wasm --cli bin/tuimark
        else
          echo "skipping the wasm size check and smoke test: node not found"
        fi

  wasm-test:
    desc: Run go test for the core packages under GOOS=js GOARCH=wasm with Node (about a minute; CI runs it, verify does not).
    env:
      GOOS: js
      GOARCH: wasm
    cmds:
      - go test -exec "$PWD/.github/scripts/go-js-wasm-exec.sh" . ./internal/...

  host-ts-deps:
    desc: Install examples/host-ts's dependencies (@thelacanians/tuimark, a file dependency on
      sdk/ts), fresh, because bun copies a file directory. Skipped without `bun`.
    dir: examples/host-ts
    cmds:
      - |
        if command -v bun >/dev/null 2>&1; then
          rm -rf node_modules
          bun install --frozen-lockfile
        else
          echo "skipping examples/host-ts install: bun not found"
        fi

  sdk-test:
    desc: Install, test, and type-check sdk/ts (@thelacanians/tuimark). Needs `bun`.
    dir: sdk/ts
    cmds:
      - bun install --frozen-lockfile
      - bun test
      - bunx tsc --noEmit
      # the template `tuimark new --ts` writes (SPEC test 120)
      - bunx tsc -p tsconfig.template.json

  glyph:
    desc: Build, then run every glyph spec under specs/glyphrun/. The examples/host-ts
      specs (host_ts*.yml) run a Bun parent, so without `bun` on PATH they are skipped
      with a message instead of failing; CI and the release workflow install Bun, so
      they always run there.
    deps: [build, host-ts-deps]
    cmds:
      - |
        for f in specs/glyphrun/*.yml; do
          case "$(basename "$f")" in
            host_ts*.yml)
              if ! command -v bun >/dev/null 2>&1; then
                echo "skipping examples/host-ts spec: bun not found"
                continue
              fi
              ;;
          esac
          glyph run "$f" --format md || exit 1
        done

  bench:
    desc: Run the performance benchmarks of SPEC v0.4a §21 test 125 (internal/play, a settled
      80x24 session, one input per iteration; each must stay under 16 ms/op) and print the
      numbers. They are benchmarks, not timed assertions in go test.
    cmds:
      - go test ./internal/play -run '^$' -bench . -benchmem -count 1

  fuzz:
    desc: Run every Go fuzz target for a short time (FUZZTIME, default 20s each). Not part of verify or CI; a crash writes its input under testdata/fuzz/ next to the target, to be committed as a regression case.
    vars:
      FUZZTIME: '{{.FUZZTIME | default "20s"}}'
    cmds:
      - go test -run '^$' -fuzz '^FuzzParse$' -fuzztime {{.FUZZTIME}} ./internal/parse
      - go test -run '^$' -fuzz '^FuzzFormat$' -fuzztime {{.FUZZTIME}} ./internal/parse
      - go test -run '^$' -fuzz '^FuzzParseSheet$' -fuzztime {{.FUZZTIME}} ./internal/css
      - go test -run '^$' -fuzz '^FuzzSheetCascade$' -fuzztime {{.FUZZTIME}} ./internal/css
      - go test -run '^$' -fuzz '^FuzzSelectorAndValues$' -fuzztime {{.FUZZTIME}} ./internal/css
      - go test -run '^$' -fuzz '^FuzzBindingGrammar$' -fuzztime {{.FUZZTIME}} ./internal/ir
      - go test -run '^$' -fuzz '^FuzzKeyTokens$' -fuzztime {{.FUZZTIME}} ./internal/ir
      - go test -run '^$' -fuzz '^FuzzScalar$' -fuzztime {{.FUZZTIME}} ./internal/ir
      - go test -run '^$' -fuzz '^FuzzParseSteps$' -fuzztime {{.FUZZTIME}} ./internal/play
      - go test -run '^$' -fuzz '^FuzzRender$' -fuzztime {{.FUZZTIME}} ./internal/host
      - go test -run '^$' -fuzz '^FuzzDocument$' -fuzztime {{.FUZZTIME}} .
      - go test -run '^$' -fuzz '^FuzzStylesheet$' -fuzztime {{.FUZZTIME}} .

  docs:
    desc: Serve the documentation site in docs/ (Next.js) at http://localhost:3000.
    dir: docs
    cmds:
      - npm install
      - npm run dev

  docs-build:
    desc: Build the documentation site as Vercel does, then check every link, anchor, and asset in the built pages.
    dir: docs
    cmds:
      - npm ci
      - npm run build
      - npm run check-links

  docs-gen:
    desc: Regenerate the docs' reference pages, command output, screenshots, and the landing page's hero from the tuimark CLI.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs

  docs-check:
    desc: Fail when the docs' generated files are stale (fix with task docs-gen).
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs --check

  vscode-test:
    desc: Build, test (grammars, manifest, client), and package the VS Code extension in editors/vscode (needs bun; not part of verify).
    dir: editors/vscode
    cmds:
      - bun install --frozen-lockfile
      - bun run build
      - bun run test
      - bunx @vscode/vsce package

  verify:
    desc: fmt + vet + test + kit-go + kit-ts + build + golden + wasm-check + glyph, in that order.
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: kit-go
      - task: kit-ts
      - task: build
      - task: golden
      - task: wasm-check
      - task: glyph
