# https://taskfile.dev
#
# Every command below also works copy-pasted into a shell by hand (in the
# repo root) in case `task` itself is not installed.
version: "3"

vars:
  AGENT_DIR: examples/agent

tasks:
  build:
    desc: Build tuimark, inbox, dashboard, monitor, and (once it has Go files) agent into bin/.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - go build -o bin/inbox ./examples/inbox
      - go build -o bin/dashboard ./examples/dashboard
      - go build -o bin/monitor ./examples/monitor
      - |
        if ls {{.AGENT_DIR}}/*.go >/dev/null 2>&1; then
          go build -o bin/agent ./{{.AGENT_DIR}}
        else
          echo "skip bin/agent: {{.AGENT_DIR}} has no Go files yet"
        fi

  fmt:
    desc: Fail if any tracked .go file is not gofmt-clean.
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "$out"
          echo "gofmt: the files above are not formatted (run: gofmt -w .)" >&2
          exit 1
        fi

  vet:
    desc: go vet the whole module.
    cmds:
      - go vet ./...

  test:
    desc: go test the whole module.
    cmds:
      - go test ./...

  golden:
    desc: Check dump goldens with the tuimark CLI's own test subcommand.
    deps: [build]
    cmds:
      - ./bin/tuimark test

  glyph:
    desc: Build, then run every glyph spec under specs/glyphrun/. The examples/host-ts
      specs (host_ts*.yml) run a Bun parent, so without `bun` on PATH they are skipped
      with a message instead of failing; CI and the release workflow install Bun, so
      they always run there.
    deps: [build]
    cmds:
      - |
        for f in specs/glyphrun/*.yml; do
          case "$(basename "$f")" in
            host_ts*.yml)
              if ! command -v bun >/dev/null 2>&1; then
                echo "skipping examples/host-ts spec: bun not found"
                continue
              fi
              ;;
          esac
          glyph run "$f" --format md || exit 1
        done

  docs:
    desc: Serve the VitePress documentation site in docs/ locally.
    dir: docs
    cmds:
      - npm install
      - npm run dev

  docs-build:
    desc: Build the documentation site into docs/.vitepress/dist, as Vercel does (fails on dead links).
    dir: docs
    cmds:
      - npm ci
      - npm run build

  docs-gen:
    desc: Regenerate the docs' reference pages, command output, and screenshots from the tuimark CLI.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs

  docs-check:
    desc: Fail when the docs' generated files are stale (fix with task docs-gen).
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs --check

  verify:
    desc: fmt + vet + test + build + golden + glyph, in that order.
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: build
      - task: golden
      - task: glyph
