# https://taskfile.dev
#
# Every command below also works copy-pasted into a shell by hand (in the
# repo root) in case `task` itself is not installed.
version: "3"

vars:
  AGENT_DIR: examples/agent

tasks:
  build:
    desc: Build tuimark, the example apps (inbox, dashboard, monitor, logs, tasks, gitui, http), and (once it has Go files) agent into bin/.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - go build -o bin/inbox ./examples/inbox
      - go build -o bin/dashboard ./examples/dashboard
      - go build -o bin/monitor ./examples/monitor
      - go build -o bin/logs ./examples/logs
      - go build -o bin/tasks ./examples/tasks
      - go build -o bin/gitui ./examples/gitui
      - go build -o bin/http ./examples/http
      - |
        if ls {{.AGENT_DIR}}/*.go >/dev/null 2>&1; then
          go build -o bin/agent ./{{.AGENT_DIR}}
        else
          echo "skip bin/agent: {{.AGENT_DIR}} has no Go files yet"
        fi

  fmt:
    desc: Fail if any tracked .go file is not gofmt-clean.
    cmds:
      - |
        out=$(gofmt -l .)
        if [ -n "$out" ]; then
          echo "$out"
          echo "gofmt: the files above are not formatted (run: gofmt -w .)" >&2
          exit 1
        fi

  vet:
    desc: go vet the whole module.
    cmds:
      - go vet ./...

  test:
    desc: go test the whole module.
    cmds:
      - go test ./...

  golden:
    desc: Check dump goldens with the tuimark CLI's own test subcommand.
    deps: [build]
    cmds:
      - ./bin/tuimark test

  host-ts-deps:
    desc: Install examples/host-ts's dependencies (@tuimark/host, a file dependency on
      sdk/ts), fresh, because bun copies a file directory. Skipped without `bun`.
    dir: examples/host-ts
    cmds:
      - |
        if command -v bun >/dev/null 2>&1; then
          rm -rf node_modules
          bun install --frozen-lockfile
        else
          echo "skipping examples/host-ts install: bun not found"
        fi

  sdk-test:
    desc: Install, test, and type-check sdk/ts (@tuimark/host). Needs `bun`.
    dir: sdk/ts
    cmds:
      - bun install --frozen-lockfile
      - bun test
      - bunx tsc --noEmit
      # the template `tuimark new --ts` writes (SPEC test 120)
      - bunx tsc -p tsconfig.template.json

  glyph:
    desc: Build, then run every glyph spec under specs/glyphrun/. The examples/host-ts
      specs (host_ts*.yml) run a Bun parent, so without `bun` on PATH they are skipped
      with a message instead of failing; CI and the release workflow install Bun, so
      they always run there.
    deps: [build, host-ts-deps]
    cmds:
      - |
        for f in specs/glyphrun/*.yml; do
          case "$(basename "$f")" in
            host_ts*.yml)
              if ! command -v bun >/dev/null 2>&1; then
                echo "skipping examples/host-ts spec: bun not found"
                continue
              fi
              ;;
          esac
          glyph run "$f" --format md || exit 1
        done

  bench:
    desc: Run the performance benchmarks of SPEC v0.4a §21 test 125 (internal/play, a settled
      80x24 session, one input per iteration; each must stay under 16 ms/op) and print the
      numbers. They are benchmarks, not timed assertions in go test.
    cmds:
      - go test ./internal/play -run '^$' -bench . -benchmem -count 1

  docs:
    desc: Serve the VitePress documentation site in docs/ locally.
    dir: docs
    cmds:
      - npm install
      - npm run dev

  docs-build:
    desc: Build the documentation site into docs/.vitepress/dist, as Vercel does (fails on dead links).
    dir: docs
    cmds:
      - npm ci
      - npm run build

  docs-gen:
    desc: Regenerate the docs' reference pages, command output, and screenshots from the tuimark CLI.
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs

  docs-check:
    desc: Fail when the docs' generated files are stale (fix with task docs-gen).
    cmds:
      - go build -o bin/tuimark ./cmd/tuimark
      - node docs/scripts/generate.mjs --check

  vscode-test:
    desc: Build, test (grammars, manifest, client), and package the VS Code extension in editors/vscode (needs bun; not part of verify).
    dir: editors/vscode
    cmds:
      - bun install --frozen-lockfile
      - bun run build
      - bun run test
      - bunx @vscode/vsce package

  verify:
    desc: fmt + vet + test + build + golden + glyph, in that order.
    cmds:
      - task: fmt
      - task: vet
      - task: test
      - task: build
      - task: golden
      - task: glyph
