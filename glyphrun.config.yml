version: 1

defaultEnvironment: local

artifactRoot: .glyphrun/runs
snapshotRoot: .glyphrun/snapshots

retention:
  keepRuns: 20

environments:
  local:
    vars:
      tuimark: ./bin/tuimark
      inbox: ./bin/inbox
      inline: ./bin/inline
      dashboard: ./bin/dashboard
      monitor: ./bin/monitor
      # The versionless examples with a help modal (help_esc_*.yml).
      ex2048: ./bin/2048
      chess: ./bin/chess
      containers: ./bin/containers
      gitui: ./bin/gitui
      http: ./bin/http
      kitgallery: ./bin/kit-gallery
      logs: ./bin/logs
      minesweeper: ./bin/minesweeper
      music: ./bin/music
      pipeline: ./bin/pipeline
      pomodoro: ./bin/pomodoro
      snake: ./bin/snake
      sudoku: ./bin/sudoku
      tetris: ./bin/tetris
    env:
      TERM: xterm-256color
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # SPEC v0.2 §26.10: "Glyphrun specs SHOULD pin TUIMARK_THEME and
      # TUIMARK_COLOR in glyphrun.config.yml" (finding 10), so the suite
      # does not depend on the caller's environment. A spec that needs to
      # exercise detection itself (the color_profile_* specs) overrides
      # these back to "" in its own target.env, which wins over this file.
      TUIMARK_THEME: dark
      TUIMARK_COLOR: truecolor

terminal:
  cols: 120
  rows: 24
  profile: xterm-256color
  normalize:
    trimRight: true
    normalizeLineEndings: true

artifacts:
  rawLog: true
  frames: true
  finalScreen: true
  snapshots: true
  agentContext: true
